      function fmtTime(iso) {
        const d = new Date(iso);
        if (isNaN(d)) return "unknown";
        const diff = (Date.now() - d.getTime()) / 1000;
        if (diff < 60) return "just now";
        if (diff < 3600) return Math.floor(diff / 60) + "m ago";
        if (diff < 86400) return Math.floor(diff / 3600) + "h ago";
        return Math.floor(diff / 86400) + "d ago";
      }

      /* ================= METRICS (computed, single source of truth) ================= */
      function computeMetrics(ts) {
        const classified = ts.filter((t) => !t.error && t.category);
        const errs = ts.filter((t) => t.error);
        const manual = ts.filter((t) => t.status === "MANUAL_REVIEW");
        const auto = ts.filter((t) => t.status === "AUTO_ROUTED");
        const catOk = classified.filter(
          (t) => t.category === t.expected_category,
        ).length;
        const urgOk = classified.filter(
          (t) => t.urgency === t.expected_urgency,
        ).length;
        const viol = ts.filter((t) => t.safety_violation);
        const gates = ts.filter(
          (t) =>
            t.safety_gate &&
            !t.safety_violation &&
            t.status === "MANUAL_REVIEW",
        );
        const confs = classified
          .map((t) => t.confidence)
          .filter((c) => c != null);
        const secs = ts
          .filter((t) => t.resolved_at)
          .map(
            (t) => (new Date(t.resolved_at) - new Date(t.created_at)) / 1000,
          );
        return {
          total: ts.length,
          classified: classified.length,
          errors: errs.length,
          auto: auto.length,
          manual: manual.length,
          automation_rate: pct(auto.length, classified.length + errs.length),
          cat_accuracy: pct(catOk, classified.length),
          urg_accuracy: pct(urgOk, classified.length),
          cat_ok: catOk,
          urg_ok: urgOk,
          avg_confidence: confs.length
            ? confs.reduce((a, b) => a + b, 0) / confs.length
            : 0,
          violations: viol.length,
          gates: gates.length,
          resolved: ts.filter((t) => t.status === "RESOLVED").length,
          avg_resolve_s: secs.length
            ? secs.reduce((a, b) => a + b, 0) / secs.length
            : null,
        };
      }

          error: "border-red-500/40 text-red-200",

          "90-100": "#10B981",

          kpi(

            "threshold: 80",

          kpi(
            "Pending Review",

      function filteredTickets() {
        let list = [...S.tickets];
        const f = S.inbox;
        if (f.status !== "all")
          list =
            f.status === "ERROR"
              ? list.filter((t) => t.error)
              : list.filter((t) => t.status === f.status);
        if (f.category !== "all")
          list = list.filter((t) => t.category === f.category);
        if (f.q) {
          const q = f.q.toLowerCase();
          list = list.filter((t) =>
            (t.subject + " " + t.external_id + " " + t.body)
              .toLowerCase()
              .includes(q),
          );
        }
        const sorters = {
          created_desc: (a, b) =>
            new Date(b.created_at) - new Date(a.created_at),
          created_asc: (a, b) =>
            new Date(a.created_at) - new Date(b.created_at),
          conf_desc: (a, b) => (b.confidence ?? -1) - (a.confidence ?? -1),
          conf_asc: (a, b) => (a.confidence ?? 999) - (b.confidence ?? 999),
          subject_asc: (a, b) => a.subject.localeCompare(b.subject),
        };
        list.sort(sorters[f.sort] || sorters.created_desc);
        return list;
      }

        const m = computeMetrics(S.tickets);

          .map((t) => {
            const cp = t.error ? null : t.category === t.expected_category;
            const up = t.error ? null : t.urgency === t.expected_urgency;

              t.expect_review == null
                ? null
                : t.expect_review
                  ? t.status === "MANUAL_REVIEW"
                  : t.status !== "MANUAL_REVIEW" || true;

            const icon = (v) =>
              v == null
                ? '<span class="text-slate-600">—</span>'

                  : '<span class="text-red-400">✗</span>';

              '<td class="px-3 py-2 mono text-xs text-slate-500">' +
              esc(t.external_id) +
              "</td>" +
              '<td class="px-3 py-2 text-xs text-slate-200 truncate max-w-[220px]">' +
              esc(t.subject) +
              "</td>" +
              '<td class="px-3 py-2 text-xs">' +
              esc(t.expected_category || "—") +
              " → " +
              esc(t.category || "ERR") +
              "</td>" +
              '<td class="px-3 py-2 text-center">' +
              icon(cp) +
              "</td>" +
              '<td class="px-3 py-2 text-xs">' +
              esc(t.expected_urgency || "—") +
              " → " +
              esc(t.urgency || "ERR") +
              "</td>" +
              '<td class="px-3 py-2 text-center">' +
              icon(up) +
              "</td>" +
              '<td class="px-3 py-2 text-center">' +

              '<td class="px-3 py-2">' +
              badgeStatus(t.status) +

          })

            m.cat_accuracy.toFixed(2) + "%",

            "ambiguous auto-routed",

            String(m.errors),

            pct(m.errors, m.total),

            : '<div class="text-sm text-slate-200 mb-3">' +
              esc(t.ai_summary || "—") +
              '</div><div class="grid grid-cols-3 gap-3 text-xs"><div><div class="text-[10px] text-slate-500 uppercase">Category</div><div class="text-white font-medium mt-1">' +
              esc(t.category || "—") +
              '</div></div><div><div class="text-[10px] text-slate-500 uppercase">Urgency</div><div class="text-white font-medium mt-1">' +
              esc(t.urgency || "—") +
              '</div></div><div><div class="text-[10px] text-slate-500 uppercase">Confidence</div><div class="text-white font-semibold mt-1 tabular">' +
              (t.confidence != null ? t.confidence : "—") +
              "</div></div></div>" +
              '<div class="pt-3 mt-3 border-t border-line text-xs"><span class="text-slate-500">Assigned:</span> <span class="mono text-slate-300">' +
              esc(t.assigned_to || "unassigned") +
              "</span></div>") +
          "</div>" +
          (t.safety_gate
            ? '<div class="bg-amber-500/10 border border-amber-500/30 rounded-lg p-3 mb-4 text-xs text-amber-300">⚠ Safety gate: <span class="mono">' +
              esc(t.safety_gate) +
              "</span></div>"
            : "") +
          (t.safety_violation
            ? '<div class="bg-red-500/10 border border-red-500/30 rounded-lg p-3 mb-4 text-xs text-red-300">✗ Safety violation: ambiguous ticket was auto-routed.</div>'
            : "") +
          (t.expected_category
            ? '<div class="card rounded-lg p-3 mb-4 text-[11px] text-slate-400 mono">expected: ' +
              esc(t.expected_category) +
              " / " +
              esc(t.expected_urgency) +
              (t.expect_review ? " / human review expected" : "") +
              "</div>"
            : "") +
          '<div class="card rounded-lg p-4"><div class="text-[11px] uppercase tracking-wider text-slate-500 mb-3">History</div>' +
          hist +
          "</div>" +
          "</div>" +
          '<div class="border-t border-line p-4 flex gap-2 flex-shrink-0">' +
          drawerActions(t) +
          "</div>";
        d.classList.remove("translate-x-full");
        $("drawer-backdrop").classList.remove("hidden");
      }
      function drawerActions(t) {
        const dis = S.actBusy ? " disabled" : "";
        if (t.status === "MANUAL_REVIEW" && !t.error)
          return (
            '<button class="btn flex-1 bg-emerald-500 text-white"' +
            dis +
            ' data-action="act" data-act="approve" data-id="' +
            t.id +
            '">✓ Approve</button><button class="btn flex-1 bg-red-500 text-white"' +
            dis +
            ' data-action="act" data-act="reject" data-id="' +
            t.id +
            '">✗ Reject</button><button class="btn px-3 bg-bg-900 border border-line text-slate-300"' +
            dis +
            ' data-action="act" data-act="escalate" data-id="' +
            t.id +
            '">Escalate</button>'
          );
        if (t.error)
          return (
            '<button class="btn flex-1 bg-accent text-white"' +
            dis +
            ' data-action="act" data-act="reprocess" data-id="' +
            t.id +
            '">↻ Reprocess AI</button>'
          );
        if (t.status === "RESOLVED")
          return '<div class="text-xs text-slate-500 mono self-center">Terminal state — no actions available</div>';
        return (
          '<button class="btn flex-1 bg-bg-900 border border-line text-slate-300 hover:border-emerald-500"' +
          dis +
          ' data-action="act" data-act="resolve" data-id="' +
          t.id +
          '">Mark Resolved</button>'
        );
      }

      /* ================= MODAL ================= */
      function openModal() {
        const m = $("modal");
        m.innerHTML =
          '<div class="card rounded-xl w-full max-w-lg"><div class="flex items-center justify-between px-5 py-3 border-b border-line"><div class="text-sm font-medium text-white">Send Test Ticket</div><button class="text-slate-500 hover:text-white" data-action="close-modal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>' +
          '<div class="p-5 space-y-3">' +
          field("External ID", "m-external", "webhook-" + Date.now()) +
          field("Customer email", "m-email", "customer@example.com") +
          field("Subject", "m-subject", "") +
          '<div><label class="block text-[11px] uppercase tracking-wider text-slate-500 mb-1">Body</label><textarea id="m-body" rows="3" class="inp resize-none"></textarea></div>' +
          '<div id="m-status" class="text-xs mono min-h-[16px]"></div>' +
          '</div><div class="flex justify-end gap-2 px-5 py-3 border-t border-line"><button class="btn text-slate-400" data-action="close-modal">Cancel</button><button id="m-submit" class="btn bg-accent text-white" data-action="submit-send">Send to webhook</button></div></div>';
        m.classList.remove("hidden");
        m.classList.add("flex");
        $("modal-backdrop").classList.remove("hidden");
        setTimeout(() => {
          const e = $("m-subject");
          if (e) e.focus();
        }, 50);
      }
      function field(label, id, val) {
        return (
          '<div><label class="block text-[11px] uppercase tracking-wider text-slate-500 mb-1">' +
          label +
          '</label><input id="' +
          id +
          '" class="inp" value="' +
          esc(val) +
          '"/></div>'
        );
      }
      function closeModal() {
        $("modal").classList.add("hidden");
        $("modal").classList.remove("flex");
        $("modal-backdrop").classList.add("hidden");
      }

      /* ================= DEMO PIPELINE SIM ================= */
      function demoClassify(subject, body) {
        const t = (subject + " " + body).toLowerCase();
        let cat = "General";
        if (
          /invoice|charge|refund|payment|billing|subscription|price|cancel/.test(
            t,
          )
        )
          cat = "Billing";
        else if (
          /crash|blank|missing column|duplicate notification|bug/.test(t)
        )
          cat = "Bug";
        else if (
          /login|password|api|webhook|integration|slow|load|lock|500|error/.test(
            t,
          )
        )
          cat = "Technical";
        else if (/feature|dark mode|sso|rate limit|add|request/.test(t))
          cat = "Feature";
        const urg = /urgent|production|outage|crash|500|compromised/.test(t)
          ? "High"
          : /refund|charge|lock|slow|declined/.test(t)
            ? "Medium"
            : "Low";
        const gate =
          body.trim().length < 20 ||
          /see attached|^help|urgent help|it doesn'?t work/.test(t) ||
          /gdpr|legal|lawsuit|security|compromised/.test(t);
        const conf = gate
          ? 70 + Math.floor(Math.random() * 15)
          : 85 + Math.floor(Math.random() * 15);
        return { cat, urg, conf, gate };
      }
      function pushHistory(t, action, ov, nv, actor) {
        t.history.push({
          action,
          old_value: ov,
          new_value: nv,
          actor,
          timestamp: new Date().toISOString(),
        });
        t.updated_at = new Date().toISOString();
      }

      /* ================= ACTIONS ================= */
      async function liveReq(method, path, body) {
        const ctrl = new AbortController();
        const to = setTimeout(() => ctrl.abort(), 8000);
        try {
          const r = await fetch(S.live.url + path, {
            method,
            headers: {
              "Content-Type": "application/json",
              "X-Admin-API-Key": S.live.key,
              "X-Webhook-API-Key": S.live.key.replace("admin", "webhook"),
            },
            body: body ? JSON.stringify(body) : undefined,
            signal: ctrl.signal,
          });
          if (r.status === 401 || r.status === 403) {
            const d = await r.json().catch(() => ({}));
            throw new Error(
              d.detail || "Unauthorized — check API key (401/403)",
            );
          }
          if (r.status === 409) {
            const d = await r.json().catch(() => ({}));
            throw new Error(d.detail || "Duplicate external_id (409)");
          }
          if (r.status === 400) {
            const d = await r.json().catch(() => ({}));
            throw new Error(d.detail || "Invalid state transition (400)");
          }
          if (!r.ok) throw new Error("HTTP " + r.status);
          return await r.json().catch(() => ({}));
        } finally {
          clearTimeout(to);
        }
      }
      async function liveLoad() {
        S.loading = true;
        S.error = null;
        render();
        try {
          const d = await liveReq("GET", "/tickets?page=1&limit=100");
          S.tickets = (d.items || []).map((t, i) => ({
            ...t,
            id: t.id ?? i + 1,
            body: "(body not exposed by REST API v0.1.0)",
            expected_category: null,
            expected_urgency: null,
            expect_review: null,
            safety_gate: null,
            safety_violation: false,
            error:
              t.ai_summary === "AI_UNAVAILABLE" ||
              t.ai_summary === "SYSTEM_ERROR",
            history: [],
          }));
          S.mode = "live";
        } catch (e) {
          S.error =
            e.name === "AbortError" ? "Request timed out after 8s" : e.message;
        }
        S.loading = false;
        render();
        if (S.error) toast("Live load failed: " + S.error, "error");
        else toast("Connected to " + S.live.url, "success");
      }
      async function doAction(act, id) {
        const t = S.tickets.find((x) => x.id === id);
        if (!t) return;
        S.actBusy = true;
        renderDrawer();
        const map = {
          approve: ["APPROVED", "✓ Ticket approved"],
          reject: ["REJECTED", "✗ Ticket rejected"],
          escalate: ["ESCALATED", "⬆ Ticket escalated"],
          resolve: ["RESOLVED", "✓ Ticket resolved"],
        };
        try {
          if (S.mode === "live") {
            const paths = {
              approve: "/admin/reviews/" + id + "/approve",
              reject: "/admin/reviews/" + id + "/reject",
              escalate: "/admin/reviews/" + id + "/escalate",
              resolve: "/admin/tickets/" + id + "/resolve",
              reprocess: "/admin/tickets/" + id + "/reprocess",
            };
            const body =
              act === "resolve" || act === "reprocess"
                ? undefined
                : {
                    reviewer_email: "operator@example.com",
                    comment: "Via dashboard",
                  };
            await liveReq("POST", paths[act], body);
            if (act === "reprocess") {
              t.status = "RECEIVED";
              t.error = false;
              pushHistory(
                t,
                "STATUS_CHANGED",
                "MANUAL_REVIEW",
                "RECEIVED",
                "admin",
              );
              setTimeout(() => liveLoad(), 1500);
            } else {
              t.status = map[act][0];
              t.reviewed_by = "operator@example.com";
              pushHistory(
                t,
                act === "resolve" ? "STATUS_CHANGED" : "REVIEWED",
                t.status,
                map[act][0],
                "operator@example.com",
              );
            }
            toast(map[act] ? map[act][1] : "↻ Reprocess scheduled", "success");
          } else {
            await new Promise((r) => setTimeout(r, 350));
            if (act === "reprocess") {
              t.error = false;
              t.status = "RECEIVED";
              pushHistory(
                t,
                "STATUS_CHANGED",
                "MANUAL_REVIEW",
                "RECEIVED",
                "admin",
              );
              toast("↻ Reprocessing…", "info");
              render();
              setTimeout(() => {
                const c = demoClassify(t.subject, t.body);
                t.category = c.cat;
                t.urgency = c.urg;
                t.confidence = c.conf;
                t.ai_summary = "Re-classified: " + t.subject.toLowerCase();
                t.status =
                  c.gate || c.conf < 80 ? "MANUAL_REVIEW" : "AUTO_ROUTED";
                t.assigned_to =
                  t.status === "AUTO_ROUTED" ? "auto-routed@example.com" : null;
                pushHistory(
                  t,
                  t.status === "AUTO_ROUTED" ? "AUTO_ROUTED" : "STATUS_CHANGED",
                  "RECEIVED",
                  t.status,
                  "background-worker",
                );
                render();
                toast("↻ Reprocessed → " + t.status, "success");
              }, 1400);
              S.actBusy = false;
              return;
            }
            t.status = map[act][0];
            t.reviewed_by = "operator@example.com";
            pushHistory(
              t,
              act === "resolve" ? "STATUS_CHANGED" : "REVIEWED",
              null,
              map[act][0],
              "operator@example.com",
            );
            toast(map[act][1], act === "reject" ? "warning" : "success");
          }
        } catch (e) {
          toast("Action failed: " + e.message, "error");
        }
        S.actBusy = false;
        render();
      }
      async function sendTicket() {
        const st = $("m-status"),
          btn = $("m-submit");
        const ext = $("m-external").value.trim(),
          email = $("m-email").value.trim(),
          subj = $("m-subject").value.trim(),
          body = $("m-body").value.trim();
        if (!ext || !email || !subj || !body) {
          st.innerHTML =
            '<span class="text-red-400">All fields are required</span>';
          return;
        }
        if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
          st.innerHTML =
            '<span class="text-red-400">Invalid email format</span>';
          return;
        }
        if (S.sendBusy) return;
        S.sendBusy = true;
        btn.disabled = true;
        st.innerHTML = '<span class="text-accent">Sending…</span>';
        try {
          if (S.mode === "live") {
            const d = await liveReq("POST", "/webhooks/tickets", {
              external_id: ext,
              customer_email: email,
              subject: subj,
              body,
            });
            st.innerHTML =
              '<span class="text-emerald-400">✓ Accepted (202) — ticket #' +
              esc(d.id) +
              " processing in background</span>";
            toast("✓ Ticket #" + d.id + " ingested", "success");
            setTimeout(() => liveLoad(), 2500);
          } else {
            await new Promise((r) => setTimeout(r, 400));
            const dup = S.tickets.find((t) => t.external_id === ext);
            if (dup) {
              st.innerHTML =
                '<span class="text-amber-400">Duplicate external_id — returned existing #' +
                dup.id +
                " (idempotent, no reprocessing)</span>";
              toast("Duplicate detected → existing #" + dup.id, "warning");
            } else {
              const now = new Date().toISOString();
              const t = {
                id: Math.max(...S.tickets.map((x) => x.id), 0) + 1,
                external_id: ext,
                customer_email: email,
                subject: subj,
                body,
                category: null,
                urgency: null,
                confidence: null,
                status: "RECEIVED",
                assigned_to: null,
                expected_category: null,
                expected_urgency: null,
                expect_review: null,
                safety_gate: null,
                safety_violation: false,
                error: false,
                ai_summary: null,
                reviewed_by: null,
                review_decision: null,
                review_comment: null,
                created_at: now,
                updated_at: now,
                resolved_at: null,
                history: [
                  {
                    action: "CREATED",
                    old_value: null,
                    new_value: "RECEIVED",
                    actor: "webhook",
                    timestamp: now,
                  },
                ],
              };
              S.tickets.unshift(t);
              st.innerHTML =
                '<span class="text-emerald-400">✓ 202 Accepted — classifying…</span>';
              setTimeout(() => {
                pushHistory(
                  t,
                  "STATUS_CHANGED",
                  "RECEIVED",
                  "PROCESSING",
                  "background-worker",
                );
                t.status = "PROCESSING";
                render();
                setTimeout(() => {
                  const c = demoClassify(subj, body);
                  t.category = c.cat;
                  t.urgency = c.urg;
                  t.confidence = c.conf;
                  t.ai_summary = "Demo classification: " + subj.toLowerCase();
                  if (c.gate || c.conf < 80) {
                    t.status = "MANUAL_REVIEW";
                    t.safety_gate = c.gate
                      ? "demo safety gate"
                      : "confidence < 80";
                    pushHistory(
                      t,
                      "STATUS_CHANGED",
                      "PROCESSING",
                      "MANUAL_REVIEW",
                      "background-worker",
                    );
                  } else {
                    t.status = "AUTO_ROUTED";
                    t.assigned_to = "auto-routed@example.com";
                    pushHistory(
                      t,
                      "AUTO_ROUTED",
                      "PROCESSING",
                      "AUTO_ROUTED",
                      "background-worker",
                    );
                  }
                  render();
                  toast("✓ #" + t.id + " → " + t.status, "success");
                }, 1200);
              }, 500);
            }
          }
          setTimeout(closeModal, 1400);
        } catch (e) {
          st.innerHTML =
            '<span class="text-red-400">' + esc(e.message) + "</span>";
          toast("Send failed: " + e.message, "error");
        }
        S.sendBusy = false;
        if (btn) btn.disabled = false;
      }

      /* ================= RENDER / ROUTER ================= */
      function renderView() {
        const v = $("view");
        if (S.error && S.mode === "live" && S.route !== "settings") {
          v.innerHTML =
            '<div class="card rounded-xl">' + errorState(S.error) + "</div>";
          return;
        }
        if (S.route === "inbox") {
          v.innerHTML = viewInbox();
          renderInboxBody();
        } else if (S.route === "queue") v.innerHTML = viewQueue();
        else if (S.route === "metrics") v.innerHTML = viewMetrics();
        else if (S.route === "audit") {
          v.innerHTML = viewAudit();
          renderAuditBody();
        } else if (S.route === "settings") v.innerHTML = viewSettings();
        else v.innerHTML = viewDashboard();
      }
      function render() {
        updateDynamic();
        renderView();
        renderDrawer();
      }
      function route() {
        const h = (location.hash || "#/dashboard")
          .replace("#/", "")
          .split("?")[0];
        const known = [
          "dashboard",
          "inbox",
          "queue",
          "metrics",
          "audit",
          "settings",
        ];
        S.route = known.includes(h) ? h : "dashboard";
        if (!known.includes(h)) location.hash = "#/dashboard";
        render();
      }

      /* ================= EVENTS (delegation) ================= */
      document.addEventListener("click", (e) => {
        const t = e.target.closest("[data-action]");
        if (!t) return;
        const a = t.dataset.action;
        if (a === "nav") return;
        if (a === "set-mode") {
          const m = t.dataset.mode;
          if (m === "live") {
            liveLoad();
          } else {
            S.mode = "demo";
            S.error = null;
            if (!S.tickets.length) S.tickets = JSON.parse(SNAPSHOT);
            render();
            toast("Demo mode", "info");
          }
        } else if (a === "retry") {
          liveLoad();
        } else if (a === "inbox-filter") {
          S.inbox.status = t.dataset.status;
          S.inbox.page = 1;
          renderView();
        } else if (a === "inbox-clear") {
          S.inbox.q = "";
          S.inbox.status = "all";
          S.inbox.category = "all";
          S.inbox.page = 1;
          renderView();
          const si = $("inbox-search");
          if (si) si.value = "";
          const sc = $("inbox-cat");
          if (sc) sc.value = "all";
        } else if (a === "inbox-page") {
          S.inbox.page = parseInt(t.dataset.page, 10) || 1;
          renderInboxBody();
        } else if (a === "open-ticket") {
          S.drawerId = parseInt(t.dataset.id, 10);
          renderDrawer();
        } else if (a === "close-drawer" || a === "drawer-backdrop") {
          S.drawerId = null;
          renderDrawer();
        } else if (a === "act") {
          doAction(t.dataset.act, parseInt(t.dataset.id, 10));
        } else if (a === "open-send") {
          openModal();
        } else if (a === "close-modal" || a === "modal-backdrop") {
          closeModal();
        } else if (a === "submit-send") {
          sendTicket();
        } else if (a === "save-settings") {
          S.live.url = ($("set-url")?.value || "").trim().replace(/\/$/, "");
          S.live.key = ($("set-key")?.value || "").trim();
          lsSet("tp_url", S.live.url);
          lsSet("tp_key", S.live.key);
          toast("Settings saved — reconnecting…", "info");
          liveLoad();
        } else if (a === "reset-demo") {
          S.tickets = JSON.parse(SNAPSHOT);
          S.mode = "demo";
          S.error = null;
          render();
          toast("Demo dataset restored", "success");
        } else if (a === "export-json") {
          const blob = new Blob(
            [
              JSON.stringify(
                { metrics: computeMetrics(S.tickets), tickets: S.tickets },
                null,
                2,
              ),
            ],
            { type: "application/json" },
          );
          const u = URL.createObjectURL(blob);
          const a2 = document.createElement("a");
          a2.href = u;
          a2.download = "ticketpilot-export.json";
          a2.click();
          URL.revokeObjectURL(u);
          toast("Exported JSON", "success");
        }
      });
      document.addEventListener("input", (e) => {
        if (e.target.id === "inbox-search") {
          S.inbox.q = e.target.value;
          S.inbox.page = 1;
          clearTimeout(window.__sd);
          window.__sd = setTimeout(renderInboxBody, 250);
        }
        if (e.target.id === "audit-q") {
          S.audit.q = e.target.value;
          clearTimeout(window.__ad);
          window.__ad = setTimeout(renderAuditBody, 250);
        }
      });
      document.addEventListener("change", (e) => {
        if (e.target.id === "inbox-cat") {
          S.inbox.category = e.target.value;
          S.inbox.page = 1;
          renderInboxBody();
        }
        if (e.target.id === "inbox-sort") {
          S.inbox.sort = e.target.value;
          renderInboxBody();
        }
        if (e.target.id === "audit-action") {
          S.audit.action = e.target.value;
          renderAuditBody();
        }
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (!$("modal").classList.contains("hidden")) closeModal();
          else if (S.drawerId != null) {
            S.drawerId = null;
            renderDrawer();
          }
        }
      });
      window.addEventListener("hashchange", route);

      /* ================= INIT ================= */
      renderShell();
      route();
    </script>
  </body>
</html>
